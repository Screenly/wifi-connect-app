---
syntax: manifest_v1
description: 'Instantly share Wi-Fi credentials on your screens.'
icon: https://playground.srly.io/edge-apps/icons/qr-wifi-app.svg
author: Screenly, Inc.
categories:
  - Utilities
ready_signal: true
settings:
  bg_color:
    type: string
    default_value: '#08060f'
    title: Background Color
    optional: true
    help_text:
      schema_version: 1
      properties:
        type: string
        advanced: true
        display_order: 6
        help_text: >-
          Color for the screen background: a hex code (e.g. #08060f) or a
          CSS color name (e.g. black). Falls back to the default if it isn't
          a recognized color.
  locale:
    type: string
    default_value: en
    title: Locale
    optional: true
    help_text:
      schema_version: 1
      properties:
        type: string
        advanced: true
        display_order: 5
        help_text: |
          Language for the on-screen text (e.g. en, fr, de, es, pt). Falls back to English if unsupported.
  sentry_dsn:
    type: secret
    title: Sentry Client Key
    optional: true
    is_global: true
    help_text:
      schema_version: 1
      properties:
        type: string
        advanced: true
        display_order: 3
        help_text: Sentry DSN used to report app errors.
  text_color:
    type: string
    default_value: '#ffffff'
    title: Text Color
    optional: true
    help_text:
      schema_version: 1
      properties:
        type: string
        advanced: true
        display_order: 7
        help_text: >-
          Color for the on-screen text: a hex code (e.g. #ffffff) or a CSS
          color name (e.g. white). Falls back to black or white only if it
          is too close to the background to read.
  wifi_header_message:
    type: string
    default_value: 'WiFi Details'
    title: Header Message
    optional: true
    help_text:
      schema_version: 1
      properties:
        type: string
        display_order: 5
        help_text: >-
          The message shown in the pill at the top of the screen. Keep it
          under 60 characters so it isn't truncated.
  wifi_hidden:
    type: string
    default_value: 'false'
    title: Hidden Network
    optional: true
    help_text:
      schema_version: 1
      properties:
        type: boolean
        advanced: true
        display_order: 1
        help_text: Enable this if the network doesn't broadcast its SSID.
  wifi_password:
    type: secret
    title: Wi-Fi Password
    optional: true
    help_text:
      schema_version: 1
      properties:
        display_order: 2
        help_text: |
          The Wi-Fi password. Leave blank for an open network that doesn't require one.
  wifi_security:
    type: string
    default_value: WPA
    title: Security Type
    optional: true
    help_text:
      schema_version: 1
      properties:
        type: select
        display_order: 4
        help_text: The encryption used by the network. Choose "Open" if it has no password.
        options:
          - label: WPA / WPA2 / WPA3
            value: WPA
          - label: WEP
            value: WEP
          - label: Open (no password)
            value: nopass
  wifi_show_password:
    type: string
    default_value: 'true'
    title: Show Password as Text
    optional: true
    help_text:
      schema_version: 1
      properties:
        type: boolean
        display_order: 3
        help_text: >
          Also show the Wi-Fi password as text on screen. On by default.
          Turn off to keep the password only in the QR code.
  wifi_ssid:
    type: string
    title: Wi-Fi Network Name (SSID)
    optional: false
    help_text:
      schema_version: 1
      properties:
        type: string
        display_order: 1
        help_text: >-
          The name of the Wi-Fi network guests should connect to. Maximum
          32 bytes (the IEEE 802.11 SSID limit).
