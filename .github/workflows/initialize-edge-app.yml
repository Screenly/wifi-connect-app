name: Initialize Edge App

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment for initialization
        required: true
        default: stage
        type: choice
        options:
          - stage
          - production
      edge_app_name:
        description: Edge App name (used for the CLI --name flag)
        required: true
        type: string
      edge_app_title:
        description: Display title for the Edge App instance
        required: true
        type: string

run-name: Initializing ${{ inputs.edge_app_name }} in ${{ inputs.environment }}

jobs:
  initialize:
    name: Initializing ${{ inputs.edge_app_name }} in ${{ inputs.environment }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    permissions:
      contents: read
      variables: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.environment == 'production' && 'master' || github.ref }}

      # First-time stage init has no STAGE_EDGE_APP_ID yet, so edge-apps-actions
      # still selects screenly_qc.yml. This repo keeps a single screenly.yml —
      # copy it for the runner only so create can proceed without a committed
      # dual manifest. After create, the id is saved to the repo variable below.
      - name: Ensure stage manifest for first-time init
        if: inputs.environment == 'stage'
        run: |
          if [ ! -f screenly_qc.yml ]; then
            cp screenly.yml screenly_qc.yml
            echo "Created screenly_qc.yml from screenly.yml for first-time stage init"
          fi

      - uses: Screenly/edge-apps-actions/initialize@v26.9.0
        with:
          screenly_api_token: ${{ secrets.SCREENLY_API_TOKEN }}
          edge_app_name: ${{ inputs.edge_app_name }}
          edge_app_title: ${{ inputs.edge_app_title }}
          environment: ${{ inputs.environment }}
          edge_app_id: ${{ secrets.EDGE_APP_ID || (inputs.environment == 'production' && vars.PRODUCTION_EDGE_APP_ID) || (inputs.environment == 'stage' && vars.STAGE_EDGE_APP_ID) || '' }}

      - name: Persist Edge App ID to GitHub Variables
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          MANIFEST="${MANIFEST_FILE_NAME:-screenly.yml}"
          if [ ! -f "$MANIFEST" ]; then
            echo "Manifest $MANIFEST not found after initialize"
            exit 1
          fi

          ID="$(grep -E '^id:[[:space:]]*' "$MANIFEST" | head -1 | awk '{print $2}' | tr -d "\"'")"
          if [ -z "$ID" ]; then
            echo "No id field found in $MANIFEST"
            cat "$MANIFEST"
            exit 1
          fi

          if [ "${{ inputs.environment }}" = "stage" ]; then
            VAR_NAME=STAGE_EDGE_APP_ID
          else
            VAR_NAME=PRODUCTION_EDGE_APP_ID
          fi

          gh variable set "$VAR_NAME" --body "$ID" --repo "${{ github.repository }}"
          echo "Set repository variable $VAR_NAME=$ID"
