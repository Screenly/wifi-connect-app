<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Wi-Fi QR Share - Screenly Edge App</title>
    <script src="screenly.js?version=1"></script>
    <script>
      // setupTheme() (called from src/main.ts) sets --theme-color-primary,
      // but that script is deferred and runs after first paint, so the icon
      // and glows would flash from the CSS fallback color to the real accent
      // color once it runs. screenly.js above is a blocking classic script,
      // so window.screenly is already populated here — apply the accent
      // immediately, before anything paints, mirroring the same "ignore
      // unset/white" rule @screenly/edge-apps' getPrimaryColor() uses.
      ;(function () {
        var accent =
          window.screenly &&
          window.screenly.settings &&
          window.screenly.settings.screenly_color_accent
        if (accent && accent.toLowerCase() !== '#ffffff') {
          document.documentElement.style.setProperty(
            '--theme-color-primary',
            accent,
          )
        }
      })()
    </script>
  </head>
  <body>
    <main id="app">
      <div class="backdrop" aria-hidden="true">
        <span class="glow glow--one"></span>
        <span class="glow glow--two"></span>
      </div>

      <section class="card">
        <div class="panel panel--info">
          <div class="icon-badge" aria-hidden="true">
            <svg
              viewBox="0 0 24 24"
              fill="none"
              xmlns="http://www.w3.org/2000/svg"
            >
              <path
                d="M2 8.5C7.5 3.5 16.5 3.5 22 8.5"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
              />
              <path
                d="M5.5 12.5C9.5 9 14.5 9 18.5 12.5"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
              />
              <path
                d="M9 16.5C10.9 14.9 13.1 14.9 15 16.5"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
              />
              <circle cx="12" cy="19.5" r="1.4" fill="currentColor" />
            </svg>
          </div>

          <p id="eyebrow" class="eyebrow">Scan to join the network</p>
          <h1 id="ssid" class="ssid">&nbsp;</h1>

          <div id="password-row" class="password-row" hidden>
            <span id="password-label" class="password-label">Password</span>
            <span id="password" class="password"></span>
          </div>

          <div id="open-badge" class="status-badge" hidden>
            <svg
              viewBox="0 0 24 24"
              fill="none"
              xmlns="http://www.w3.org/2000/svg"
            >
              <rect
                x="5"
                y="11"
                width="14"
                height="10"
                rx="2.5"
                stroke="currentColor"
                stroke-width="2"
              />
              <path
                d="M8 11V8a4 4 0 0 1 7.5-1.9"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
              />
            </svg>
            <span id="open-badge-text"
              >Open network &ndash; no password needed</span
            >
          </div>
        </div>

        <div class="panel panel--qr">
          <div class="qr-frame">
            <div
              id="qr-code"
              class="qr-code"
              role="img"
              aria-label="Wi-Fi QR code"
            ></div>
          </div>
        </div>
      </section>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
