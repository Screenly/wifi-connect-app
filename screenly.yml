---
syntax: manifest_v1
description: 'Instantly share Wi-Fi credentials on your digital signage screens with this lightweight QR code generator for Screenly Edge Apps.'
ready_signal: true
settings:
  locale:
    type: string
    default_value: en
    title: Locale
    optional: true
    help_text:
      schema_version: 1
      properties:
        type: string
        advanced: true
        display_order: 5
        help_text: |
          Language for the on-screen text (e.g. en, fr, de, es, pt). Falls back to English if unsupported.
  sentry_dsn:
    type: secret
    title: Sentry Client Key
    optional: true
    is_global: true
    help_text:
      schema_version: 1
      properties:
        type: string
        advanced: true
        display_order: 3
        help_text: Sentry Client Key from Sentry SDK for error capturing.
  wifi_bg_color:
    type: string
    default_value: '#08060f'
    title: Background Color
    optional: true
    help_text:
      schema_version: 1
      properties:
        type: string
        advanced: true
        display_order: 6
        help_text: >-
          Hex color for the screen background (e.g. #08060f). Falls back to
          the default if it isn't a valid hex color.
  wifi_header_message:
    type: string
    default_value: 'Welcome — Guest Wi-Fi'
    title: Header Message
    optional: true
    help_text:
      schema_version: 1
      properties:
        type: string
        display_order: 2
        help_text: >-
          The message shown in the pill at the top of the screen. Keep it
          under 60 characters so it isn't truncated.
  wifi_hidden:
    type: string
    default_value: 'false'
    title: Hidden Network
    optional: true
    help_text:
      schema_version: 1
      properties:
        type: boolean
        advanced: true
        display_order: 1
        help_text: Enable this if the network doesn't broadcast its SSID.
  wifi_password:
    type: secret
    title: Wi-Fi Password
    optional: true
    help_text:
      schema_version: 1
      properties:
        type: string
        display_order: 3
        help_text: |
          The Wi-Fi password. Leave blank for an open network that doesn't require one.
  wifi_security:
    type: string
    default_value: WPA
    title: Security Type
    optional: true
    help_text:
      schema_version: 1
      properties:
        type: select
        display_order: 4
        help_text: The encryption used by the network. Choose "Open" if it has no password.
        options:
          - label: WPA / WPA2 / WPA3
            value: WPA
          - label: WEP
            value: WEP
          - label: Open (no password)
            value: nopass
  wifi_show_password:
    type: string
    default_value: 'false'
    title: Show Password as Text
    optional: true
    help_text:
      schema_version: 1
      properties:
        type: boolean
        advanced: true
        display_order: 2
        help_text: |
          Also display the Wi-Fi password as text on screen. Off by default — scanning the QR code is enough to join, so leaving this off means the password can't be read off the screen. Turn it on if guests should be able to type it in by hand too.
  wifi_ssid:
    type: string
    title: Wi-Fi Network Name (SSID)
    optional: false
    help_text:
      schema_version: 1
      properties:
        type: string
        display_order: 1
        help_text: The name of the Wi-Fi network guests should connect to.
  wifi_text_color:
    type: string
    default_value: '#ffffff'
    title: Text Color
    optional: true
    help_text:
      schema_version: 1
      properties:
        type: string
        advanced: true
        display_order: 7
        help_text: >-
          Hex color for the on-screen text (e.g. #ffffff). Falls back to a
          contrasting color automatically if it's too close to the
          background color to read comfortably.
