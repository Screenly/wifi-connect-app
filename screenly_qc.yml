---
syntax: manifest_v1
description: 'Instantly share Wi-Fi credentials on your digital signage screens with this lightweight QR code generator for Screenly Edge Apps.'
ready_signal: true
settings:
  locale:
    type: string
    default_value: en
    title: Locale
    optional: true
    help_text:
      schema_version: 1
      properties:
        type: string
        advanced: true
        display_order: 3
        help_text: |
          Language for the on-screen text (e.g. en, fr, de, es, pt). Falls back to English if unsupported.
  sentry_dsn:
    type: secret
    title: Sentry Client Key
    optional: true
    is_global: true
    help_text:
      schema_version: 1
      properties:
        type: string
        advanced: true
        display_order: 2
        help_text: Sentry Client Key from Sentry SDK for error capturing.
  wifi_hidden:
    type: string
    default_value: 'false'
    title: Hidden Network
    optional: true
    help_text:
      schema_version: 1
      properties:
        type: boolean
        advanced: true
        display_order: 1
        help_text: Enable this if the network doesn't broadcast its SSID.
  wifi_password:
    type: secret
    title: Wi-Fi Password
    optional: true
    help_text:
      schema_version: 1
      properties:
        type: string
        display_order: 2
        help_text: |
          The Wi-Fi password. Leave blank for an open network that doesn't require one.
  wifi_security:
    type: string
    default_value: WPA
    title: Security Type
    optional: true
    help_text:
      schema_version: 1
      properties:
        type: select
        display_order: 3
        help_text: The encryption used by the network. Choose "Open" if it has no password.
        options:
          - label: WPA / WPA2 / WPA3
            value: WPA
          - label: WEP
            value: WEP
          - label: Open (no password)
            value: nopass
  wifi_ssid:
    type: string
    title: Wi-Fi Network Name (SSID)
    optional: false
    help_text:
      schema_version: 1
      properties:
        type: string
        display_order: 1
        help_text: The name of the Wi-Fi network guests should connect to.
